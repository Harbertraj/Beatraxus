# Project-wide Gradle settings for local low-RAM build environment (8 GB RAM / 2 cores)
org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process

# Android & Jetpack Settings
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.compose=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false

# Kotlin Settings
kotlin.code.style=official
