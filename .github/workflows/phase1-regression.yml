name: Phase 1 - Regression Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/usr/local/lib/android/sdk' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install documented Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.0"

      - name: Prepare non-secret Firebase placeholder
        shell: bash
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            printf '%s\n' '{"project_info":{},"client":[]}' > app/google-services.json
          fi
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        shell: bash
