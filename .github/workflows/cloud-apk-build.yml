name: Cloud APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: beatraxus-cloud-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Beatraxus (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      ANDROID_HOME: ${{ vars.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.0"

      - name: Prepare Google services configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Using the private Firebase configuration from repository secrets."
          elif [ -f app/google-services.json ]; then
            echo "Using app/google-services.json from the repository."
          else
            printf '%s\n' '{"project_info":{},"client":[]}' > app/google-services.json
            echo "::warning::No Firebase config supplied. APK compilation can continue, but Firebase-backed Play Together features may not connect."
          fi
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Prepare optional release signing
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/beatraxus-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            {
              printf 'RELEASE_STORE_FILE=%s\n' "$KEYSTORE_PATH"
              printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
              printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
              printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
            } >> local.properties
            echo "Release signing keystore configured."
          else
            echo "::warning::Release signing secrets are incomplete. The project will use its debug signing fallback. This APK is for testing only, not Play Store upload."
          fi

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          chmod +x ./gradlew
          TASK="assembleDebug"
          if [ "${{ inputs.build_type }}" = "release" ]; then
            TASK="assembleRelease"
          fi
          ./gradlew "$TASK" \
            --no-daemon \
            --stacktrace \
            --build-cache \
            --parallel \
            --max-workers=4

      - name: List generated APKs
        if: always()
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/${{ inputs.build_type }}"
          if [ -d "$APK_DIR" ]; then
            find "$APK_DIR" -type f -name '*.apk' -printf '%f (%k KB)\n'
          else
            echo "No APK output directory was created."
          fi

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beatraxus-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary configuration and signing files
        if: always()
        shell: bash
        run: |
          rm -f local.properties app/google-services.json "${RUNNER_TEMP}/beatraxus-release.jks"
